name: soutnaqi
description: SoutNaqi (صوت نقي) — audio and video processing for Android, iOS, and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cross_file: ^0.3.4
  desktop_drop: ^0.5.0
  equatable: ^2.0.7
  ffmpeg_kit_flutter_new_min: ^3.1.0
  file_picker: ^10.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  http: ^1.4.0
  hugeicons: ^1.1.7
  intl: ^0.20.2
  just_audio: ^0.10.4
  loading_animation_widget: ^1.3.0
  logger: ^2.5.0
  mime: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.0
  uuid: ^4.5.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  lint: ^2.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/brand/app-icon.png
    background_color: "#2563EB"
    theme_color: "#2563EB"
  image_path: assets/brand/app-icon.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/brand/app-icon-foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4F6FA"
  color_dark: "#0B0F17"
  image: assets/brand/splash-mark.png
  android_12:
    color: "#F4F6FA"
    color_dark: "#0B0F17"
    image: assets/brand/splash-mark.png
    icon_background_color: "#F4F6FA"
    icon_background_color_dark: "#0B0F17"
